<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Background Remover</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #151823;
    --panel-2: #1c2030;
    --border: #2a2f42;
    --text: #eef0f6;
    --muted: #9aa1b4;
    --accent: #7c5cff;
    --accent-2: #37d6b8;
    --danger: #ff6868;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #241a4a33, transparent),
      radial-gradient(1000px 500px at 100% 0%, #0d3b3433, transparent),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 28px 24px 8px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin: 8px 0 0; font-size: 14px; }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .controls-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
  }
  select, button {
    font: inherit;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 9px 14px;
    cursor: pointer;
  }
  select { appearance: none; }
  .btn-primary {
    background: linear-gradient(90deg, var(--accent), #5b3bff);
    border: none;
    font-weight: 600;
    color: white;
  }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost:hover { border-color: var(--accent); }

  #dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    min-height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
    overflow: hidden;
    background:
      repeating-conic-gradient(#20242f 0% 25%, #171a23 0% 50%) 50% / 24px 24px;
  }
  #dropzone.drag { border-color: var(--accent); background-color: #1b1430; }
  #dropzone img { max-width: 100%; max-height: 420px; display: block; border-radius: 10px; }
  #dropzone .hint { font-size: 13px; }
  #dropzone .hint b { color: var(--text); }

  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) { .compare { grid-template-columns: 1fr; } }
  .pane { text-align: center; }
  .pane h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .pane .frame {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: repeating-conic-gradient(#20242f 0% 25%, #171a23 0% 50%) 50% / 20px 20px;
    min-height: 300px;
    display: flex; align-items: center; justify-content: center;
  }
  .pane img { max-width: 100%; max-height: 420px; display: block; }

  .footer-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .status { font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--accent-2); }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #ffffff55;
    border-top-color: white;
    border-radius: 50%;
    display: inline-block;
    animation: spin .8s linear infinite;
    margin-right: 8px;
    vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  input[type=file] { display: none; }
</style>
</head>
<body>

<header>
  <h1>Background Remover</h1>
  <p>Upload a photo → remove the background → download a transparent PNG. Hair, fur and fine edges handled by a matting refinement pass.</p>
</header>

<main>
  <div class="card">
    <div class="controls-row">
      <label for="subject" style="color:var(--muted); font-size:13px;">Subject</label>
      <select id="subject">
        <option value="auto">Auto-detect</option>
        <option value="portrait">Portrait / person (best for hair)</option>
        <option value="object">Product / object</option>
      </select>

      <label for="quality" style="color:var(--muted); font-size:13px;">Quality</label>
      <select id="quality">
        <option value="precise" selected>Precise (matting refinement — best hair/fur edges)</option>
        <option value="fast">Fast (good edges, quicker)</option>
      </select>

      <button id="removeBtn" class="btn-primary" disabled>Remove background</button>
      <button id="resetBtn" class="btn-ghost" style="display:none;">Start over</button>
    </div>

    <div id="dropzone">
      <div id="dzEmpty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9aa1b4" stroke-width="1.6"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <div class="hint"><b>Click to upload</b> or drag and drop</div>
        <div class="hint">JPEG, PNG, or WEBP · up to 50MB</div>
      </div>
      <div id="dzPreview" style="display:none;">
        <div class="compare" id="compareGrid">
          <div class="pane">
            <h3>Original</h3>
            <div class="frame"><img id="origImg" /></div>
          </div>
          <div class="pane">
            <h3>Background removed</h3>
            <div class="frame" id="resultFrame">
              <span style="color:var(--muted); font-size:13px;">Click "Remove background" →</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp" />

    <div class="footer-actions">
      <div class="status" id="status"></div>
      <button id="downloadBtn" class="btn-primary" style="display:none;">Download PNG</button>
    </div>
  </div>
</main>

<script>
const dropzone = document.getElementById('dropzone');
const dzEmpty = document.getElementById('dzEmpty');
const dzPreview = document.getElementById('dzPreview');
const fileInput = document.getElementById('fileInput');
const origImg = document.getElementById('origImg');
const resultFrame = document.getElementById('resultFrame');
const removeBtn = document.getElementById('removeBtn');
const resetBtn = document.getElementById('resetBtn');
const downloadBtn = document.getElementById('downloadBtn');
const statusEl = document.getElementById('status');
const subjectSel = document.getElementById('subject');
const qualitySel = document.getElementById('quality');

let currentFile = null;
let resultUrl = null;

function setStatus(msg, cls) {
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

function handleFile(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['jpg','jpeg','png','webp'].includes(ext)) {
    setStatus('File must be JPEG, PNG, or WEBP.', 'error');
    return;
  }
  if (file.size > 50 * 1024 * 1024) {
    setStatus('Your media must be smaller than 50MB.', 'error');
    return;
  }
  currentFile = file;
  const url = URL.createObjectURL(file);
  origImg.src = url;
  dzEmpty.style.display = 'none';
  dzPreview.style.display = 'block';
  resultFrame.innerHTML = '<span style="color:var(--muted); font-size:13px;">Click "Remove background" →</span>';
  removeBtn.disabled = false;
  resetBtn.style.display = 'inline-block';
  downloadBtn.style.display = 'none';
  resultUrl = null;
  setStatus('');
}

dropzone.addEventListener('click', (e) => {
  if (!currentFile) fileInput.click();
});
fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

['dragenter','dragover'].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); }));
['dragleave','drop'].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); }));
dropzone.addEventListener('drop', (e) => {
  const file = e.dataTransfer.files[0];
  handleFile(file);
});

resetBtn.addEventListener('click', () => {
  currentFile = null;
  resultUrl = null;
  fileInput.value = '';
  dzEmpty.style.display = 'flex';
  dzPreview.style.display = 'none';
  removeBtn.disabled = true;
  resetBtn.style.display = 'none';
  downloadBtn.style.display = 'none';
  setStatus('');
});

removeBtn.addEventListener('click', async () => {
  if (!currentFile) return;
  removeBtn.disabled = true;
  setStatus('Analyzing subject, segmenting, refining edges…');
  resultFrame.innerHTML = '<span class="spinner"></span><span style="color:var(--muted); font-size:13px;">Processing…</span>';

  const form = new FormData();
  form.append('image', currentFile);
  form.append('subject', subjectSel.value);
  form.append('quality', qualitySel.value);

  try {
    const res = await fetch('/api/remove-background', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) {
      setStatus(data.error || 'Unable to process the request.', 'error');
      resultFrame.innerHTML = '<span style="color:var(--danger); font-size:13px;">Failed</span>';
      removeBtn.disabled = false;
      return;
    }
    resultUrl = data.url;
    resultFrame.innerHTML = '';
    const img = document.createElement('img');
    img.src = data.url + '?t=' + Date.now();
    resultFrame.appendChild(img);
    downloadBtn.style.display = 'inline-block';
    setStatus(`Done in ${data.processing_seconds}s · model: ${data.model} · quality: ${data.quality}`, 'ok');
  } catch (err) {
    setStatus('Network error — is the server running?', 'error');
    resultFrame.innerHTML = '<span style="color:var(--danger); font-size:13px;">Failed</span>';
  } finally {
    removeBtn.disabled = false;
  }
});

downloadBtn.addEventListener('click', () => {
  if (!resultUrl) return;
  const a = document.createElement('a');
  a.href = resultUrl;
  a.download = 'background-removed.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
});
</script>

</body>
</html>
